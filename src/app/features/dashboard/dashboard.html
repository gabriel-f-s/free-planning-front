<div class="max-w-7xl mx-auto p-4 md:p-6 flex flex-col gap-8">

  <div class="border-b-4 border-black dark:border-white pb-4 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
    <div>
      <h1 class="text-4xl font-bold tracking-tight text-black dark:text-white">Painel de Controle</h1>
      <p class="text-gray-600 dark:text-gray-400 font-mono mt-2 flex items-center gap-2">
        <i class="pi pi-compass text-sm"></i> Visão geral do seu caderno de negócios
      </p>
    </div>

    <div class="flex flex-wrap items-center gap-3 justify-end w-full md:w-auto">
      <button
        type="button"
        (click)="toggleDarkMode()"
        class="font-mono font-bold border-2 border-black dark:border-white p-2 px-4 bg-white dark:bg-zinc-900 text-black dark:text-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] hover:-translate-y-0.5 transition-all flex items-center gap-2 rounded-none">
        @if (isDarkMode) {
          <i class="pi pi-sun"></i> Modo Claro
        } @else {
          <i class="pi pi-moon"></i> Modo Escuro
        }
      </button>

      <div class="font-mono text-sm font-bold border-2 border-black dark:border-white p-2 px-4 bg-white dark:bg-zinc-900 text-black dark:text-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transform rotate-1">
        <i class="pi pi-calendar mr-2"></i> Hoje, Dashboard
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white dark:bg-zinc-900 border-4 border-black dark:border-white p-5 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] dark:shadow-[6px_6px_0px_0px_rgba(255,255,255,1)] flex items-center justify-between hover:-translate-y-1 transition-transform">
      <div class="flex flex-col">
        <span class="font-mono text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider font-bold">Projetos Ativos</span>
        <span class="text-3xl font-bold text-black dark:text-white mt-1">12</span>
      </div>
      <div class="w-12 h-12 bg-black dark:bg-white text-white dark:text-black flex items-center justify-center rounded-full border-2 border-black dark:border-white shadow-[2px_2px_0px_0px_rgba(0,0,0,0.3)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,0.3)]">
        <i class="pi pi-briefcase text-xl"></i>
      </div>
    </div>

    <div class="bg-green-50 dark:bg-zinc-800 border-4 border-black dark:border-white p-5 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] dark:shadow-[6px_6px_0px_0px_rgba(255,255,255,1)] flex items-center justify-between hover:-translate-y-1 transition-transform">
      <div class="flex flex-col">
        <span class="font-mono text-xs text-green-700 dark:text-green-400 uppercase tracking-wider font-bold">Faturamento (Mês)</span>
        <span class="text-3xl font-bold text-black dark:text-white mt-1">R$ 8.450</span>
      </div>
      <div class="w-12 h-12 bg-white dark:bg-zinc-900 border-2 border-black dark:border-white text-black dark:text-white flex items-center justify-center shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)]">
        <i class="pi pi-money-bill text-xl"></i>
      </div>
    </div>

    <div class="bg-yellow-50 dark:bg-zinc-800 border-4 border-black dark:border-white p-5 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] dark:shadow-[6px_6px_0px_0px_rgba(255,255,255,1)] flex items-center justify-between hover:-translate-y-1 transition-transform">
      <div class="flex flex-col">
        <span class="font-mono text-xs text-yellow-700 dark:text-yellow-400 uppercase tracking-wider font-bold">Entregas na Semana</span>
        <span class="text-3xl font-bold text-black dark:text-white mt-1">3</span>
      </div>
      <div class="w-12 h-12 bg-yellow-400 dark:bg-zinc-700 border-2 border-black dark:border-white text-black dark:text-white flex items-center justify-center shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)]">
        <i class="pi pi-exclamation-triangle text-xl"></i>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

    <div class="lg:col-span-8 bg-white dark:bg-zinc-900 border-4 border-black dark:border-white shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] dark:shadow-[8px_8px_0px_0px_rgba(255,255,255,1)] p-6">

      <app-projects></app-projects>

    </div>

    <div class="lg:col-span-4 flex flex-col gap-8">

      <div class="bg-white dark:bg-zinc-900 border-4 border-black dark:border-white shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] dark:shadow-[8px_8px_0px_0px_rgba(255,255,255,1)] p-6 relative">
        <div class="absolute -top-3 left-6 flex gap-3">
          <div class="w-12 h-6 bg-gray-200 dark:bg-zinc-700 border-2 border-black dark:border-white transform -rotate-3 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)]"></div>
        </div>

        <h3 class="text-xl font-bold mb-4 border-b-2 border-dashed border-black dark:border-white pb-2 flex items-center gap-2 text-black dark:text-white">
          <i class="pi pi-calculator"></i> Calc. GetNinjas
        </h3>
        <p class="font-mono text-xs text-gray-600 dark:text-gray-400 mb-5 leading-relaxed">
          Calcule o custo das moedas em relação ao valor do projeto para descobrir o ROI.
        </p>

        <div class="flex flex-col gap-4">
          <div class="flex flex-col gap-1">
            <label class="font-mono text-xs font-bold text-black dark:text-white">Custo de Moedas (Qtd)</label>
            <input pInputText type="number" class="w-full p-2 border-2 border-black dark:border-white rounded-none bg-white dark:bg-zinc-900 text-black dark:text-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)]" placeholder="Ex: 200" />
          </div>

          <div class="flex flex-col gap-1">
            <label class="font-mono text-xs font-bold text-black dark:text-white">Valor do Projeto (R$)</label>
            <input pInputText type="number" class="w-full p-2 border-2 border-black dark:border-white rounded-none bg-white dark:bg-zinc-900 text-black dark:text-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)]" placeholder="Ex: 1500" />
          </div>

          <button pButton label="Calcular ROI" class="w-full mt-2 font-mono font-bold text-white dark:text-black bg-black dark:bg-white border-2 border-black dark:border-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] dark:hover:shadow-[6px_6px_0px_0px_rgba(255,255,255,1)] transition-all rounded-none justify-center"></button>

          <div class="mt-2 bg-gray-100 dark:bg-zinc-800 border-2 border-black dark:border-white border-dashed p-3 text-center shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)]">
            <span class="font-mono text-xs block text-gray-600 dark:text-gray-400">Lucro Estimado</span>
            <span class="font-bold text-lg text-green-700 dark:text-green-400">R$ 1.470,00</span>
          </div>
        </div>
      </div>

      <div class="bg-yellow-200 dark:bg-zinc-800 border-2 border-black dark:border-white shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] dark:shadow-[6px_6px_0px_0px_rgba(255,255,255,1)] p-5 transform rotate-2 hover:rotate-0 transition-transform duration-300">
        <h4 class="font-mono font-bold text-sm mb-3 flex items-center gap-2 border-b border-black dark:border-white pb-1 text-black dark:text-white">
          <i class="pi pi-pen-to-square"></i> Notas Rápidas
        </h4>
        <textarea
          class="w-full bg-transparent border-none focus:ring-0 resize-none font-mono text-sm text-black dark:text-white placeholder-gray-600 dark:placeholder-gray-400 p-0"
          rows="5"
          placeholder="- Ligar para cliente X&#10;- Revisar escopo do app&#10;- Comprar café"></textarea>
      </div>

    </div>

  </div>
</div>
