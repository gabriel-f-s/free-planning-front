<router-outlet />

<p-toast position="top-right" [breakpoints]="{'920px': {width: '100%', right: '0', left: '0'}}">
  <ng-template let-message pTemplate="message">
    <div class="flex items-start gap-3 w-full font-sans">
      <i class="pi text-xl mt-0.5"
         [ngClass]="{
           'pi-check-circle text-green-500': message.severity === 'success',
           'pi-exclamation-circle text-red-500': message.severity === 'error',
           'pi-info-circle text-blue-500': message.severity === 'info',
           'pi-exclamation-triangle text-yellow-500': message.severity === 'warn'
         }"></i>
      <div class="flex flex-col gap-1">
        <span class="font-bold text-slate-900 dark:text-neutral-100 text-sm">{{ message.summary }}</span>
        <span class="text-slate-600 dark:text-neutral-400 text-sm leading-snug">{{ message.detail }}</span>
      </div>
    </div>
  </ng-template>
</p-toast>
