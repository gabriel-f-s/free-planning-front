<div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-neutral-900 font-sans text-slate-900 dark:text-neutral-100 animate-fade-in-up">
  <div class="bg-white dark:bg-neutral-800 rounded-2xl shadow-xl border border-slate-200 dark:border-neutral-700 p-8 max-w-md w-full">

    <div class="flex justify-center mb-6">
      <div class="w-12 h-12 bg-slate-800 dark:bg-slate-700 text-white rounded-xl flex items-center justify-center shadow-sm">
        <i class="pi pi-compass text-xl"></i>
      </div>
    </div>

    <div class="mb-8 text-center">
      <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-neutral-100">Bem-vindo de volta</h2>
      <p class="text-sm text-slate-500 dark:text-neutral-400 mt-2">Acesse seu painel de controle</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="doLogin()" class="flex flex-col gap-5">

      <div class="flex flex-col gap-1.5">
        <div class="flex gap-3 items-center">
          <span class="p-inputgroup-addon bg-slate-50 dark:bg-neutral-900 border-slate-300 dark:border-neutral-600 text-slate-500"><i class="pi pi-envelope"></i></span>
          <label class="text-sm font-semibold text-slate-700 dark:text-neutral-300">E-mail</label>
        </div>
        <div class="p-inputgroup">
          <input
            pInputText
            type="email"
            formControlName="email"
            class="w-full p-3 border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-800 text-slate-900 dark:text-neutral-100 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-shadow"
            placeholder="seu@email.com" />
        </div>

        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <span class="mt-1 text-xs font-medium text-red-500 dark:text-red-400 flex items-center gap-1">
            <i class="pi pi-exclamation-circle text-[10px]"></i> E-mail inválido
          </span>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between items-center">
          <div class="flex gap-3 items-center">
            <span class="p-inputgroup-addon bg-slate-50 dark:bg-neutral-900 border-slate-300 dark:border-neutral-600 text-slate-500"><i class="pi pi-lock"></i></span>
            <label class="text-sm font-semibold text-slate-700 dark:text-neutral-300">Senha</label>
          </div>
          <a href="#" class="text-xs font-medium text-slate-600 hover:text-slate-800 dark:text-neutral-400 dark:hover:text-neutral-200 transition-colors">Esqueceu a senha?</a>
        </div>
        <div class="p-inputgroup">
          <input
            pInputText
            type="password"
            formControlName="password"
            class="w-full p-3 border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-800 text-slate-900 dark:text-neutral-100 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-shadow"
            placeholder="••••••••" />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full py-3 mt-2 font-semibold text-white bg-slate-800 rounded-lg hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex justify-center items-center gap-2">
        Entrar
      </button>

      <p class="text-center text-sm mt-4 pt-6 border-t border-slate-200 dark:border-neutral-700 text-slate-600 dark:text-neutral-400">
        Ainda não possui uma conta?
        <a routerLink="/auth/register" class="font-semibold text-slate-800 hover:text-slate-900 dark:text-neutral-200 dark:hover:text-white transition-colors ml-1">
          Registre-se
        </a>
      </p>

    </form>
  </div>
</div>
