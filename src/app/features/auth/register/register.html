<div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-neutral-900 font-sans text-slate-900 dark:text-neutral-100 py-12 animate-fade-in-up">
  <div class="bg-white dark:bg-neutral-800 rounded-2xl shadow-xl border border-slate-200 dark:border-neutral-700 p-8 max-w-md w-full">

    <div class="mb-8 text-center">
      <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-neutral-100">Criar Conta</h2>
      <p class="text-sm text-slate-500 dark:text-neutral-400 mt-2">Configure seu perfil para começar</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="doRegister()" class="flex flex-col gap-5">

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-slate-700 dark:text-neutral-300">Nome</label>
        <input
          pInputText
          type="text"
          formControlName="name"
          class="w-full p-3 rounded-lg border border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-900 text-slate-900 dark:text-neutral-100 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-shadow"
          placeholder="Seu nome completo" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-slate-700 dark:text-neutral-300">E-mail</label>
        <input
          pInputText
          type="email"
          formControlName="email"
          class="w-full p-3 rounded-lg border border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-900 text-slate-900 dark:text-neutral-100 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-shadow"
          placeholder="seu@email.com" />

        @if (registerForm.get('email')?.invalid && registerForm.get('email')?.touched) {
          <span class="mt-1 text-xs font-medium text-red-500 dark:text-red-400 flex items-center gap-1">
            <i class="pi pi-exclamation-circle text-[10px]"></i> E-mail inválido
          </span>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-slate-700 dark:text-neutral-300">Senha</label>
        <input
          pInputText
          type="password"
          formControlName="password"
          class="w-full p-3 rounded-lg border border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-900 text-slate-900 dark:text-neutral-100 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-shadow"
          placeholder="Mínimo de 6 caracteres" />

        @if (registerForm.get('password')?.invalid && registerForm.get('password')?.touched) {
          <span class="mt-1 text-xs font-medium text-red-500 dark:text-red-400 flex items-center gap-1">
            <i class="pi pi-exclamation-circle text-[10px]"></i> A senha é muito curta
          </span>
        }
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-semibold text-slate-700 dark:text-neutral-300">Profissão</label>
          <div class="relative">
            <select
              formControlName="occupation"
              class="w-full p-3 rounded-lg border border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-900 text-slate-900 dark:text-neutral-100 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-shadow appearance-none cursor-pointer">
              <option value='DEVELOPER'>{{ Occupation.DEVELOPER }}</option>
              <option value='DESIGNER'>{{ Occupation.DESIGNER }}</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
              <i class="pi pi-chevron-down text-xs"></i>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-semibold text-slate-700 dark:text-neutral-300">Valor/Hora (R$)</label>
          <p-inputNumber
            formControlName="hourlyRate"
            mode="currency"
            currency="BRL"
            locale="pt-BR"
            styleClass="w-full"
            inputStyleClass="w-full p-3 rounded-lg border border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-900 focus:ring-2 focus:ring-slate-500 focus:border-slate-500"
            placeholder="Ex: 80,00">
          </p-inputNumber>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full py-3 mt-4 font-semibold text-white bg-slate-800 rounded-lg hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex justify-center items-center">
        Finalizar Cadastro
      </button>

      <p class="text-center text-sm mt-2 pt-6 border-t border-slate-200 dark:border-neutral-700 text-slate-600 dark:text-neutral-400">
        Já possui uma conta?
        <a routerLink="/auth/login" class="font-semibold text-slate-800 hover:text-slate-900 dark:text-neutral-200 dark:hover:text-white transition-colors ml-1">
          Faça login
        </a>
      </p>

    </form>
  </div>
</div>
