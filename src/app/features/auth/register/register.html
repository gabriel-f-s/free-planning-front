<div class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white dark:bg-zinc-900 border-4 border-black dark:border-white shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] dark:shadow-[8px_8px_0px_0px_rgba(255,255,255,1)] p-8 max-w-md w-full relative">

    <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-20 h-8 bg-gray-200 dark:bg-zinc-700 border-2 border-black dark:border-white transform rotate-2 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)]"></div>

    <div class="mb-8 mt-2 text-center">
      <h2 class="text-3xl font-bold tracking-tight text-black dark:text-white">Criar Conta</h2>
      <p class="text-sm text-gray-600 dark:text-gray-400 font-mono mt-2">Junte-se à plataforma</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="doRegister()" class="flex flex-col gap-5">

      <div class="flex flex-col gap-2">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-user text-xs"></i> Nome
        </label>
        <input
          pInputText
          type="text"
          formControlName="name"
          class="w-full p-3 border-2 border-black dark:border-white rounded-none bg-white dark:bg-zinc-900 text-black dark:text-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          placeholder="Seu nome completo" />
      </div>

      <div class="flex flex-col gap-2">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-envelope text-xs"></i> E-mail
        </label>
        <input
          pInputText
          type="email"
          formControlName="email"
          class="w-full p-3 border-2 border-black dark:border-white rounded-none bg-white dark:bg-zinc-900 text-black dark:text-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          placeholder="seu@email.com" />

        @if (registerForm.get('email')?.invalid && registerForm.get('email')?.touched) {
          <span class="mt-1 text-xs font-mono font-bold bg-black dark:bg-white text-white dark:text-black px-2 py-1 inline-flex items-center gap-1 w-fit border-2 border-black dark:border-white">
            <i class="pi pi-exclamation-triangle text-[10px]"></i> E-mail inválido
          </span>
        }
      </div>

      <div class="flex flex-col gap-2">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-lock text-xs"></i> Senha
        </label>
        <input
          pInputText
          type="password"
          formControlName="password"
          class="w-full p-3 border-2 border-black dark:border-white rounded-none bg-white dark:bg-zinc-900 text-black dark:text-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          placeholder="Crie uma senha" />

        @if (registerForm.get('password')?.invalid && registerForm.get('password')?.touched) {
          <span class="mt-1 text-xs font-mono font-bold bg-black dark:bg-white text-white dark:text-black px-2 py-1 inline-flex items-center gap-1 w-fit border-2 border-black dark:border-white">
            <i class="pi pi-exclamation-triangle text-[10px]"></i> Mínimo de 6 dígitos
          </span>
        }
      </div>

      <div class="flex flex-col gap-2">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-briefcase text-xs"></i> Profissão
        </label>
        <div class="relative">
          <select
            formControlName="occupation"
            class="w-full p-3 border-2 border-black dark:border-white rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow appearance-none bg-white dark:bg-zinc-900 text-black dark:text-white cursor-pointer font-mono">
            <option value='DEVELOPER'>{{ Occupation.DEVELOPER }}</option>
            <option value='DESIGNER'>{{ Occupation.DESIGNER }}</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-black dark:text-white">
            <i class="pi pi-chevron-down text-xs"></i>
          </div>
        </div>
      </div>

      <button
        pButton
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full py-3 mt-4 font-mono font-bold text-white dark:text-black bg-black dark:bg-white border-2 border-black dark:border-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] dark:hover:shadow-[6px_6px_0px_0px_rgba(255,255,255,1)] hover:-translate-y-0.5 transition-all disabled:bg-gray-400 disabled:border-gray-500 disabled:shadow-none disabled:translate-y-0 disabled:text-gray-200 rounded-none cursor-pointer justify-center">
        Criar Conta
      </button>

      <p class="text-center font-mono text-sm mt-4 border-t-2 border-dashed border-gray-300 dark:border-zinc-600 pt-6 text-black dark:text-white">
        Já possui uma conta? <br>
        <a routerLink="/auth/login" class="font-bold border-b-2 border-black dark:border-white text-black dark:text-white hover:bg-black dark:hover:bg-white hover:text-white dark:hover:text-black transition-colors pb-0.5 mt-2 inline-block">
          Faça o login
        </a>
      </p>

    </form>
  </div>
</div>
