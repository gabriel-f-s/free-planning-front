<div class="max-w-4xl mx-auto py-8 px-4 md:px-8 flex flex-col gap-8 mb-12">

  <div class="flex items-center gap-3 border-b border-slate-200 dark:border-neutral-800 pb-4">
    <div class="w-10 h-10 rounded-xl bg-slate-800 dark:bg-neutral-800 flex items-center justify-center shadow-sm">
      <i class="pi pi-cog text-white dark:text-neutral-300 text-lg"></i>
    </div>
    <div>
      <h2 class="text-2xl font-bold text-slate-900 dark:text-neutral-100">Configurações de Conta</h2>
      <p class="text-sm text-slate-500 dark:text-neutral-400">Gerencie seus dados pessoais, atuação e segurança.</p>
    </div>
  </div>

  @if (isLoading) {
    <div class="flex flex-col gap-4">
      <p-skeleton width="10rem" height="1.5rem"></p-skeleton>
      <div class="flex gap-4">
        <p-skeleton width="100%" height="3rem"></p-skeleton>
        <p-skeleton width="100%" height="3rem"></p-skeleton>
      </div>
      <p-skeleton width="100%" height="3rem"></p-skeleton>
    </div>
  } @else {
    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="bg-white dark:bg-neutral-900 rounded-2xl shadow-sm border border-slate-200 dark:border-neutral-800 overflow-hidden">
      <div class="p-6 md:p-8 border-b border-slate-100 dark:border-neutral-800">
        <h3 class="text-lg font-bold text-slate-800 dark:text-neutral-200 mb-6">Perfil Profissional</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2 md:col-span-2">
            <label class="text-sm font-medium text-slate-700 dark:text-neutral-300">Nome Completo</label>
            <input
              type="text"
              formControlName="name"
              class="w-full px-3 py-2 text-sm text-slate-800 dark:text-neutral-200 bg-white dark:bg-neutral-900 border border-slate-300 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400 dark:focus:ring-neutral-600 transition-colors"
              placeholder="Ex: João Silva">
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-slate-700 dark:text-neutral-300">Área de Atuação</label>
            <p-select
              formControlName="occupation"
              [options]="occupationOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="Selecione..."
              styleClass="w-full text-sm">
            </p-select>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-slate-700 dark:text-neutral-300">Valor da Hora (R$)</label>
            <p-inputNumber
              formControlName="hourlyRate"
              mode="currency"
              currency="BRL"
              locale="pt-BR"
              styleClass="w-full"
              inputStyleClass="w-full text-sm"
              placeholder="R$ 0,00">
            </p-inputNumber>
          </div>
        </div>
      </div>
      <div class="bg-slate-50 dark:bg-neutral-800/40 px-6 py-4 flex justify-between items-center">
        <p class="text-xs text-slate-500 dark:text-neutral-500">Este valor hora é usado como base inicial para novos projetos.</p>
        <button
          type="submit"
          [disabled]="profileForm.invalid || isSavingProfile || profileForm.pristine"
          class="px-5 py-2 text-sm font-medium text-white bg-slate-800 rounded-lg hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
          <i class="pi" [ngClass]="isSavingProfile ? 'pi-spin pi-spinner' : 'pi-check'"></i>
          Salvar Perfil
        </button>
      </div>
    </form>

    <form [formGroup]="emailForm" (ngSubmit)="saveEmail()" class="bg-white dark:bg-neutral-900 rounded-2xl shadow-sm border border-slate-200 dark:border-neutral-800 overflow-hidden">
      <div class="p-6 md:p-8 border-b border-slate-100 dark:border-neutral-800">
        <h3 class="text-lg font-bold text-slate-800 dark:text-neutral-200 mb-6">Endereço de E-mail</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-slate-700 dark:text-neutral-300">Novo E-mail</label>
            <input
              type="email"
              formControlName="email"
              class="w-full px-3 py-2 text-sm text-slate-800 dark:text-neutral-200 bg-white dark:bg-neutral-900 border border-slate-300 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400 dark:focus:ring-neutral-600 transition-colors"
              placeholder="seu@email.com">
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-slate-700 dark:text-neutral-300">Senha Atual <span class="text-xs text-slate-400 font-normal">(Para confirmar a troca)</span></label>
            <input
              type="password"
              formControlName="password"
              class="w-full px-3 py-2 text-sm text-slate-800 dark:text-neutral-200 bg-white dark:bg-neutral-900 border border-slate-300 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400 dark:focus:ring-neutral-600 transition-colors"
              placeholder="••••••••">
          </div>
        </div>
      </div>
      <div class="bg-slate-50 dark:bg-neutral-800/40 px-6 py-4 flex justify-end">
        <button
          type="submit"
          [disabled]="emailForm.invalid || isSavingEmail"
          class="px-5 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 dark:bg-neutral-800 dark:text-neutral-200 dark:border-neutral-600 dark:hover:bg-neutral-700 shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
          <i class="pi" [ngClass]="isSavingEmail ? 'pi-spin pi-spinner' : 'pi-envelope'"></i>
          Atualizar E-mail
        </button>
      </div>
    </form>

    <form [formGroup]="passwordForm" (ngSubmit)="savePassword()" class="bg-white dark:bg-neutral-900 rounded-2xl shadow-sm border border-slate-200 dark:border-neutral-800 overflow-hidden border-l-4 border-l-red-500/80">
      <div class="p-6 md:p-8 border-b border-slate-100 dark:border-neutral-800">
        <h3 class="text-lg font-bold text-slate-800 dark:text-neutral-200 mb-6">Segurança da Conta</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2 md:col-span-2 md:w-1/2">
            <label class="text-sm font-medium text-slate-700 dark:text-neutral-300">Senha Atual</label>
            <input
              type="password"
              formControlName="oldPassword"
              class="w-full px-3 py-2 text-sm text-slate-800 dark:text-neutral-200 bg-white dark:bg-neutral-900 border border-slate-300 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400 dark:focus:ring-neutral-600 transition-colors"
              placeholder="••••••••">
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-slate-700 dark:text-neutral-300">Nova Senha</label>
            <input
              type="password"
              formControlName="newPassword"
              class="w-full px-3 py-2 text-sm text-slate-800 dark:text-neutral-200 bg-white dark:bg-neutral-900 border border-slate-300 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400 dark:focus:ring-neutral-600 transition-colors"
              placeholder="Mínimo de 8 caracteres">
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-slate-700 dark:text-neutral-300">Confirmar Nova Senha</label>
            <input
              type="password"
              formControlName="confirmNewPassword"
              class="w-full px-3 py-2 text-sm text-slate-800 dark:text-neutral-200 bg-white dark:bg-neutral-900 border border-slate-300 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400 dark:focus:ring-neutral-600 transition-colors"
              placeholder="Repita a nova senha">
          </div>
        </div>
      </div>
      <div class="bg-slate-50 dark:bg-neutral-800/40 px-6 py-4 flex justify-between items-center">
        <p class="text-xs text-slate-500 dark:text-neutral-500">O sistema será deslogado após a troca de senha.</p>
        <button
          type="submit"
          [disabled]="passwordForm.invalid || isSavingPassword"
          class="px-5 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 dark:bg-red-700 dark:hover:bg-red-600 shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
          <i class="pi" [ngClass]="isSavingPassword ? 'pi-spin pi-spinner' : 'pi-lock'"></i>
          Alterar Senha
        </button>
      </div>
    </form>
  }

  <p-toast position="top-right"></p-toast>
  <p-confirmDialog appendTo="body" styleClass="max-w-[450px] font-sans"></p-confirmDialog>
</div>
