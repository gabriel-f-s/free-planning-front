<div class="bg-white dark:bg-zinc-900 rounded-2xl shadow-xl border border-gray-100 dark:border-zinc-800 p-6 md:p-8 max-w-4xl mx-auto font-sans text-gray-900 dark:text-gray-100">
<div class="mb-8 border-b border-gray-200 dark:border-zinc-800 pb-4">
    <h2 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white flex items-center gap-2">
      <i class="pi pi-book text-blue-600 dark:text-blue-500"></i> Novo Projeto
    </h2>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Preencha as informações do novo escopo para começar.</p>
  </div>

  <form [formGroup]="projectForm" (ngSubmit)="save()" class="flex flex-col gap-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="flex flex-col gap-1.5 w-full">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Nome do projeto</label>
        <input
          pInputText
          type="text"
          formControlName="title"
          class="w-full p-3 rounded-lg border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow"
          placeholder="Ex: Refatoração do App" />
      </div>

      <div class="flex flex-col gap-1.5 w-full">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Cliente</label>
        <p-autoComplete
          [formControl]="clientControl"
          [suggestions]="clients"
          field="name"
          [forceSelection]="true"
          [dropdown]="true"
          appendTo="body"
          panelStyleClass="!z-[9999]"
          (completeMethod)="onClientComplete($event)"
          (onSelect)="selectClient($event.value)"
          styleClass="w-full"
          inputStyleClass="w-full p-3 rounded-l-lg border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Busque o cliente">

          <ng-template pTemplate="footer">
            <button
              type="button"
              class="w-full text-center text-sm font-semibold text-blue-600 hover:bg-blue-50 dark:text-blue-400 dark:hover:bg-blue-900/20 py-3 transition-colors cursor-pointer border-t border-gray-100 dark:border-zinc-800"
              (click)="openClientDialog()">
              <i class="pi pi-plus text-xs mr-1"></i> Cadastrar Novo Cliente
            </button>
          </ng-template>
        </p-autoComplete>
      </div>
    </div>
<div class="flex flex-col gap-1.5 w-full">
      <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Descrição</label>
      <textarea
        pTextarea
        formControlName="description"
        rows="4"
        class="w-full p-3 rounded-lg border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow resize-y"
        placeholder="Detalhes do projeto, expectativas..."></textarea>
    </div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="flex flex-col gap-1.5 w-full">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Plataforma de Aquisição</label>
        <p-select
          [options]="projectPlatform"
          formControlName="platform"
          appendTo="body"
          styleClass="w-full"
          [showClear]="true"
          placeholder="Selecione a plataforma">
        </p-select>
      </div>

      <div class="flex flex-col gap-1.5 w-full">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Tipo</label>
        <p-select
          [options]="projectType"
          formControlName="type"
          appendTo="body"
          styleClass="w-full"
          [showClear]="true"
          placeholder="Selecione o tipo">
        </p-select>
      </div>
    </div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-gray-50 dark:bg-zinc-800/50 p-6 rounded-xl border border-gray-100 dark:border-zinc-800">
      <div class="flex flex-col gap-1.5 w-full">
        <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">Valor Mínimo</label>
        <p-inputNumber formControlName="minimumValue" mode="currency" currency="BRL" locale="pt-BR" styleClass="w-full" inputStyleClass="w-full"></p-inputNumber>
      </div>

      <div class="flex flex-col gap-1.5 w-full">
        <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">Valor Máximo</label>
        <p-inputNumber formControlName="maximumValue" mode="currency" currency="BRL" locale="pt-BR" styleClass="w-full" inputStyleClass="w-full"></p-inputNumber>
      </div>

      <div class="flex flex-col gap-1.5 w-full">
        <label class="text-xs font-semibold text-green-600 dark:text-green-500 uppercase tracking-wider">Valor Fechado</label>
        <p-inputNumber formControlName="closedValue" mode="currency" currency="BRL" locale="pt-BR" styleClass="w-full" inputStyleClass="w-full bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-400 font-bold"></p-inputNumber>
      </div>
    </div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="flex flex-col gap-1.5 w-full">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Previsão de Entrega</label>
        <p-datepicker
          formControlName="deliveryForecast"
          appendTo="body"
          dateFormat="yy-mm-dd"
          dataType="string"
          [showIcon]="true"
          styleClass="w-full"
          inputStyleClass="w-full" />
      </div>

      <div class="flex flex-col gap-1.5 w-full">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Data de Entrega Efetiva</label>
        <p-datepicker
          formControlName="deliveryDate"
          appendTo="body"
          dateFormat="yy-mm-dd"
          dataType="string"
          [showIcon]="true"
          styleClass="w-full"
          inputStyleClass="w-full" />
      </div>
    </div>
<div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-6 mt-2 border-t border-gray-200 dark:border-zinc-800">
      <button
        type="button"
        (click)="close()"
        class="px-5 py-2.5 font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 dark:bg-zinc-800 dark:text-gray-200 dark:border-zinc-700 dark:hover:bg-zinc-700 transition-colors w-full sm:w-auto">
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="projectForm.invalid"
        class="px-6 py-2.5 font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-colors w-full sm:w-auto">
        Salvar Projeto
      </button>
    </div>
  </form>
</div>
