<div class="bg-white dark:bg-zinc-900 border-4 border-black dark:border-white shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] dark:shadow-[8px_8px_0px_0px_rgba(255,255,255,1)] p-6 md:p-8 max-w-4xl mx-auto rounded-md relative">

  <div class="absolute -top-3 left-8 flex gap-4">
    <div class="w-6 h-6 bg-gray-100 dark:bg-zinc-800 border-2 border-black dark:border-white rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)]"></div>
    <div class="w-6 h-6 bg-gray-100 dark:bg-zinc-800 border-2 border-black dark:border-white rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)]"></div>
  </div>

  <div class="mb-6 mt-4 border-b-2 border-dashed border-black dark:border-white pb-4">
    <h2 class="text-2xl font-bold tracking-tight text-black dark:text-white flex items-center gap-2">
      <i class="pi pi-book text-xl"></i> Detalhes do Projeto
    </h2>
    <p class="text-sm text-gray-600 dark:text-gray-400 font-mono mt-1">Preencha as informações do novo escopo</p>
  </div>

  <form [formGroup]="projectForm" (ngSubmit)="save()" class="flex flex-col gap-5">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col gap-2 w-full">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-receipt text-xs"></i> Nome do projeto
        </label>
        <input
          pInputText
          type="text"
          formControlName="title"
          class="w-full p-3 border-2 border-black dark:border-white rounded-none bg-white dark:bg-zinc-900 text-black dark:text-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          placeholder="Ex: Refatoração do App" />
      </div>

      <div class="flex flex-col gap-2 w-full">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-building text-xs"></i> Buscar Cliente
        </label>
        <p-autoComplete
          [formControl]="clientControl"
          [suggestions]="clients"
          field="name"
          [forceSelection]="true"
          [dropdown]="true"
          appendTo="body"
          panelStyleClass="!z-[9999]"
          (completeMethod)="onClientComplete($event)"
          (onSelect)="selectClient($event.value)"
          class="w-full flex [&_.p-autocomplete-dropdown]:!bg-black [&_.p-autocomplete-dropdown]:!text-white [&_.p-autocomplete-dropdown]:!border-2 [&_.p-autocomplete-dropdown]:!border-black [&_.p-autocomplete-dropdown]:!rounded-none [&_.p-autocomplete-dropdown]:hover:!bg-gray-800 dark:[&_.p-autocomplete-dropdown]:!bg-white dark:[&_.p-autocomplete-dropdown]:!text-black dark:[&_.p-autocomplete-dropdown]:!border-white dark:[&_.p-autocomplete-dropdown]:hover:!bg-zinc-200 transition-colors"
          inputStyleClass="w-full !p-3 !border-2 !border-black dark:!border-white !border-r-0 !rounded-none !bg-white dark:!bg-zinc-900 !text-black dark:!text-white !shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:!shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:!shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:!shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          placeholder="Nome do cliente">
          <ng-template pTemplate="selectedItem" let-value>
            @if (value) {
              <span class="font-mono">{{ value.name }}</span>
            }
          </ng-template>
          <ng-template pTemplate="item" let-item>
            <span class="font-mono">{{ item.name }}</span>
          </ng-template>
          <ng-template pTemplate="footer">
            <button
              type="button"
              class="w-full bg-gray-100 dark:bg-zinc-800 text-black dark:text-white border-t-2 border-dashed border-black dark:border-white hover:bg-gray-200 dark:hover:bg-zinc-700 font-mono font-bold py-3 rounded-none transition-colors"
              (click)="openClientDialog()">
              + Criar Novo Cliente
            </button>
          </ng-template>
        </p-autoComplete>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4">
      <div class="flex flex-col gap-2 w-full">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-align-left text-xs"></i> Descrição
        </label>
        <textarea
          pTextarea
          formControlName="description"
          rows="3"
          class="w-full p-3 border-2 border-black dark:border-white rounded-none bg-white dark:bg-zinc-900 text-black dark:text-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow resize-none"
          placeholder="Detalhes do projeto..."></textarea>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col gap-2 w-full">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-share-alt text-xs"></i> Plataforma de Aquisição
        </label>
        <p-select
          [options]="projectPlatform"
          formControlName="platform"
          appendTo="body"
          class="w-full !border-2 !border-black dark:!border-white !rounded-none !shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:!shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] hover:!shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:hover:!shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          [showClear]="true"
          placeholder="Selecione a plataforma">
          <ng-template pTemplate="selectedItem" let-item>
            @if (item) {
              <span class="font-mono">{{ item | projectPlatform }}</span>
            }
          </ng-template>
          <ng-template pTemplate="item" let-item>
            <span class="font-mono">{{ item | projectPlatform }}</span>
          </ng-template>
        </p-select>
      </div>

      <div class="flex flex-col gap-2 w-full">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-tags text-xs"></i> Tipo
        </label>
        <p-select
          [options]="projectType"
          formControlName="type"
          appendTo="body"
          class="w-full !border-2 !border-black dark:!border-white !rounded-none !shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:!shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] hover:!shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:hover:!shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          [showClear]="true"
          placeholder="Selecione o tipo">
          <ng-template pTemplate="selectedItem" let-item>
            @if (item) {
              <span class="font-mono">{{ item | projectType }}</span>
            }
          </ng-template>
          <ng-template pTemplate="item" let-item>
            <span class="font-mono">{{ item | projectType }}</span>
          </ng-template>
        </p-select>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-y border-dashed border-gray-300 dark:border-zinc-600 py-6 my-2 bg-gray-50 dark:bg-zinc-800 -mx-6 px-6">
      <div class="flex flex-col gap-2 w-full">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-arrow-down-left text-xs"></i> Valor Mínimo
        </label>
        <p-inputNumber
          formControlName="minimumValue"
          inputStyleClass="w-full !p-3 !border-2 !border-black dark:!border-white !rounded-none !bg-white dark:!bg-zinc-900 !text-black dark:!text-white !shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:!shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:!shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:!shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          mode="currency"
          currency="BRL"
          locale="pt-BR" />
      </div>

      <div class="flex flex-col gap-2 w-full">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-arrow-up-right text-xs"></i> Valor Máximo
        </label>
        <p-inputNumber
          formControlName="maximumValue"
          inputStyleClass="w-full !p-3 !border-2 !border-black dark:!border-white !rounded-none !bg-white dark:!bg-zinc-900 !text-black dark:!text-white !shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:!shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:!shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:!shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          mode="currency"
          currency="BRL"
          locale="pt-BR" />
      </div>

      <div class="flex flex-col gap-2 w-full">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-money-bill text-xs"></i> Valor Fechado
        </label>
        <p-inputNumber
          formControlName="closedValue"
          inputStyleClass="w-full !p-3 !border-2 !border-black dark:!border-white !rounded-none !bg-green-50 dark:!bg-emerald-950/40 !text-black dark:!text-white !shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:!shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:!shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:!shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          mode="currency"
          currency="BRL"
          locale="pt-BR" />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col gap-2 w-full">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-calendar-clock text-xs"></i> Previsão de Entrega
        </label>
        <p-datepicker
          formControlName="deliveryForecast"
          appendTo="body"
          class="w-full flex [&_button]:!bg-black [&_button]:!text-white [&_button]:!border-2 [&_button]:!border-black [&_button]:!rounded-none [&_button]:hover:!bg-gray-800 dark:[&_button]:!bg-white dark:[&_button]:!text-black dark:[&_button]:!border-white dark:[&_button]:hover:!bg-zinc-200 [&_button]:transition-colors"
          inputStyleClass="w-full !p-3 !border-2 !border-black dark:!border-white !border-r-0 !rounded-none !bg-white dark:!bg-zinc-900 !text-black dark:!text-white !shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:!shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:!shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:!shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          dateFormat="yy-mm-dd"
          dataType="string"
          [panelStyle]="{'z-index': '9999'}"
          [showIcon]="true" />
      </div>

      <div class="flex flex-col gap-2 w-full">
        <label class="font-mono text-sm font-bold text-black dark:text-white flex items-center gap-2">
          <i class="pi pi-calendar-plus text-xs"></i> Data de Entrega
        </label>
        <p-datepicker
          formControlName="deliveryDate"
          appendTo="body"
          class="w-full flex [&_button]:!bg-black [&_button]:!text-white [&_button]:!border-2 [&_button]:!border-black [&_button]:!rounded-none [&_button]:hover:!bg-gray-800 dark:[&_button]:!bg-white dark:[&_button]:!text-black dark:[&_button]:!border-white dark:[&_button]:hover:!bg-zinc-200 [&_button]:transition-colors"
          inputStyleClass="w-full !p-3 !border-2 !border-black dark:!border-white !border-r-0 !rounded-none !bg-white dark:!bg-zinc-900 !text-black dark:!text-white !shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:!shadow-[2px_2px_0px_0px_rgba(255,255,255,1)] focus:!shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:focus:!shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] transition-shadow"
          dateFormat="yy-mm-dd"
          dataType="string"
          [panelStyle]="{'z-index': '9999'}"
          [showIcon]="true" />
      </div>
    </div>

    <div class="mt-8 flex flex-col-reverse md:flex-row justify-end gap-4 border-t-2 border-black dark:border-white pt-6">
      <button
        type="button"
        (click)="close()"
        class="px-6 py-2 font-mono font-bold text-black dark:text-white bg-white dark:bg-zinc-900 border-2 border-black dark:border-white hover:bg-gray-100 dark:hover:bg-zinc-800 transition-colors rounded-none w-full md:w-auto text-center justify-center shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] dark:shadow-[2px_2px_0px_0px_rgba(255,255,255,1)]">
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="projectForm.invalid"
        class="px-8 py-2 font-mono font-bold text-white dark:text-black bg-black dark:bg-white border-2 border-black dark:border-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,1)] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] dark:hover:shadow-[6px_6px_0px_0px_rgba(255,255,255,1)] hover:-translate-y-0.5 transition-all disabled:bg-gray-400 disabled:border-gray-500 disabled:shadow-none disabled:translate-y-0 disabled:text-gray-200 rounded-none cursor-pointer w-full md:w-auto text-center justify-center">
        Salvar Projeto
      </button>
    </div>
  </form>
</div>
