<div class="bg-white dark:bg-zinc-900 rounded-2xl shadow-xl border border-gray-100 dark:border-zinc-800 p-6 md:p-8 max-w-lg mx-auto font-sans text-gray-900 dark:text-gray-100">
<div class="flex items-center gap-4 mb-8 border-b border-gray-200 dark:border-zinc-800 pb-4">
    <div class="w-10 h-10 bg-blue-50 text-blue-600 dark:bg-blue-900/20 dark:text-blue-500 rounded-lg flex items-center justify-center shrink-0">
      <i class="pi pi-user-plus text-lg"></i>
    </div>
    <div>
      <h2 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white leading-none">Novo Cliente</h2>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Adicionar contato à sua carteira.</p>
    </div>
  </div>

  <form [formGroup]="clientForm" (ngSubmit)="save()" class="flex flex-col gap-5">

    <div class="flex flex-col gap-1.5 w-full">
      <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Nome do cliente</label>
      <input
        pInputText
        type="text"
        formControlName="name"
        class="w-full p-3 rounded-lg border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow"
        placeholder="Ex: Empresa X / João Silva"
      />
    </div>

    <div class="flex flex-col gap-1.5 w-full">
      <div class="gap-2 flex items-center">
        <span class="p-inputgroup-addon bg-gray-50 dark:bg-zinc-800 border-gray-300 dark:border-zinc-700 text-gray-500"><i class="pi pi-envelope"></i></span>
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">E-mail</label>
      </div>

      <div class="p-inputgroup">
        <input
          pInputText
          type="email"
          formControlName="email"
          class="w-full p-3 border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow"
          placeholder="contato@empresa.com"
        />
      </div>
    </div>

    <div class="flex flex-col gap-1.5 w-full">
      <div class="gap-2 flex items-center">
        <span class="p-inputgroup-addon bg-gray-50 dark:bg-zinc-800 border-gray-300 dark:border-zinc-700 text-gray-500"><i class="pi pi-phone"></i></span>
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Telefone / WhatsApp</label>
      </div>
      <div class="p-inputgroup">
        <input
          pInputText
          type="tel"
          formControlName="phone"
          class="w-full p-3 border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow"
          placeholder="(00) 00000-0000"
        />
      </div>
    </div>
<div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-6 mt-2 border-t border-gray-200 dark:border-zinc-800">
      <button
        type="button"
        (click)="close()"
        class="px-5 py-2.5 font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 dark:bg-zinc-800 dark:text-gray-200 dark:border-zinc-700 dark:hover:bg-zinc-700 transition-colors w-full sm:w-auto">
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="clientForm.invalid"
        class="px-6 py-2.5 font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-colors w-full sm:w-auto">
        Salvar
      </button>
    </div>
  </form>
</div>
