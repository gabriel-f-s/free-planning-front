<div class="bg-white dark:bg-neutral-800 rounded-2xl shadow-xl border border-slate-200 dark:border-neutral-700 p-6 md:p-8 max-w-lg mx-auto font-sans text-slate-900 dark:text-neutral-100">

  <div class="flex items-center gap-4 mb-8 border-b border-slate-200 dark:border-neutral-700 pb-4">
    <div class="w-10 h-10 bg-slate-100 text-slate-700 dark:bg-neutral-700 dark:text-slate-300 rounded-lg flex items-center justify-center shrink-0">
      <i class="pi text-lg" [ngClass]="isEditing ? 'pi-user-edit' : 'pi-user-plus'"></i>
    </div>
    <div>
      <h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-neutral-100 leading-none">
        @if (isEditing) {
          Editar Cliente
        } @else {
          Novo Cliente
        }
      </h2>
      <p class="text-xs text-slate-500 dark:text-neutral-400 mt-1">
        @if (isEditing) {
          Atualize os dados de contato do cliente.
        } @else {
          Adicionar contato à sua carteira.
        }
      </p>
    </div>
  </div>

  <form [formGroup]="clientForm" (ngSubmit)="save()" class="flex flex-col gap-5">

    <div class="flex flex-col gap-1.5 w-full">
      <label class="text-sm font-semibold text-slate-700 dark:text-neutral-300">Nome do cliente</label>
      <input
        pInputText
        type="text"
        formControlName="name"
        class="w-full p-3 rounded-lg border border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-900 text-slate-900 dark:text-neutral-100 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-shadow"
        placeholder="Ex: Empresa X / João Silva"
      />
    </div>

    <div class="flex flex-col gap-1.5 w-full">
      <div class="gap-2 flex items-center">
        <span class="p-inputgroup-addon bg-slate-50 dark:bg-neutral-800 border-slate-300 dark:border-neutral-600 text-slate-500"><i class="pi pi-envelope"></i></span>
        <label class="text-sm font-semibold text-slate-700 dark:text-neutral-300">E-mail</label>
      </div>
      <div class="p-inputgroup">
        <input
          pInputText
          type="email"
          formControlName="email"
          class="w-full p-3 border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-900 text-slate-900 dark:text-neutral-100 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-shadow"
          placeholder="contato@empresa.com"
        />
      </div>
    </div>

    <div class="flex flex-col gap-1.5 w-full">
      <div class="gap-2 flex items-center">
        <span class="p-inputgroup-addon bg-slate-50 dark:bg-neutral-800 border-slate-300 dark:border-neutral-600 text-slate-500"><i class="pi pi-phone"></i></span>
        <label class="text-sm font-semibold text-slate-700 dark:text-neutral-300">Telefone / WhatsApp</label>
      </div>
      <div class="p-inputgroup">
        <input
          pInputText
          type="tel"
          formControlName="phone"
          class="w-full p-3 border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-900 text-slate-900 dark:text-neutral-100 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-shadow"
          placeholder="(00) 00000-0000"
        />
      </div>
    </div>

    <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-6 mt-2 border-t border-slate-200 dark:border-neutral-700">
      <button
        type="button"
        (click)="close()"
        class="px-5 py-2.5 font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 dark:bg-neutral-800 dark:text-neutral-200 dark:border-neutral-600 dark:hover:bg-neutral-700 transition-colors w-full sm:w-auto">
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="clientForm.invalid"
        class="px-6 py-2.5 font-medium text-white bg-slate-800 rounded-lg hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-colors w-full sm:w-auto">
        @if (isEditing) {
          Atualizar Contato
        } @else {
          Salvar Cliente
        }
      </button>
    </div>
  </form>
</div>
